name: 每日 GitHub Trending 推送到企业微信
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  push-to-wecom:
    runs-on: ubuntu-latest
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      LANGUAGE: ''
      LIMIT: 10
    steps:
      - name: 从GitHub官方搜索获取热门项目
        run: |
          # 构造搜索词
          if [ -z "$LANGUAGE" ]; then
            QUERY="stars:>1000 created:>2026-01-01 sort:stars-desc"
          else
            QUERY="stars:>1000 language:$LANGUAGE created:>2026-01-01 sort:stars-desc"
          fi

          # -G 自动url编码，解决空格&特殊字符截断问题
          RAW=$(curl -s -G \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/search/repositories" \
            --data-urlencode "q=$QUERY" \
            --data-urlencode "per_page=$LIMIT")

          if echo "$RAW" | jq -e '.items' >/dev/null 2>&1; then
            MESSAGE=$(echo "$RAW" | jq -r '
              .items | to_entries | map(
                "### \(.key+1). [\(.value.full_name)](\(.value.html_url))\n" +
                "📌 语言：\(.value.language // "未标注") | ⭐ Star：\(.value.stargazers_count) | 🍴 Fork：\(.value.forks_count)\n" +
                "🕒 最后更新：\(.value.updated_at[0:10])\n" +
                (if (.value.topics | length) > 0 then "🏷️ 标签：\(.value.topics | join(", "))\n" else "" end) +
                "📝 \(.value.description // "暂无项目描述")\n" +
                (if .value.homepage and .value.homepage != "" then "🔗 项目主页：\(.value.homepage)\n" else "" end)
              ) | join("\n")
            ')
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n$MESSAGE"
          else
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n⚠️  获取项目数据失败\n关键词：GitHub"
          fi

          curl -s -X POST "$WECOM_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$FULL_CONTENT" '{"msgtype":"markdown","markdown":{"content":$c}}')"
