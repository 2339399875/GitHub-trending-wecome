name: 每日 GitHub Trending 推送到企业微信
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  push-to-wecom:
    runs-on: ubuntu-latest
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      LANGUAGE: 'python'
      SINCE: 'daily'
      LIMIT: 10
    steps:
      - name: 抓取Trending（带重试）
        run: |
          # 重试3次
          RAW=""
          for i in {1..3}; do
            echo "第 $i 次尝试拉取数据..."
            if [ -z "$LANGUAGE" ]; then
              API_URL="https://ghapi.huchen.dev/repositories?since=$SINCE"
            else
              API_URL="https://ghapi.huchen.dev/repositories?language=$LANGUAGE&since=$SINCE"
            fi
            RAW=$(curl -s --connect-timeout 8 --max-time 15 "$API_URL")
            # 判断是否是合法数组json
            if echo "$RAW" | jq -e 'type=="array"' >/dev/null 2>&1; then
              echo "✅ 拉取成功"
              break
            fi
            echo "❌ 本次失败，等待2秒重试"
            sleep 2
          done

          # 处理消息
          if echo "$RAW" | jq -e 'type=="array"' >/dev/null 2>&1; then
            MESSAGE=$(echo "$RAW" | jq -r --argjson limit "$LIMIT" '
              .[0:$limit] | to_entries | map(
                "### \(.key+1). [\(.value.name)](\(.value.url))\n⭐ Stars: \(.value.stars) | 📝 \(.value.description // "暂无描述")\n"
              ) | join("\n")
            ')
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n$MESSAGE"
          else
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n⚠️ 连续3次拉取Trending数据失败，接口超时，稍后再试\n关键词：GitHub"
          fi

          # 推送到企业微信
          curl -s -X POST "$WECOM_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$FULL_CONTENT" '{"msgtype":"markdown","markdown":{"content":$c}}')"
