name: 每日 GitHub Trending 推送到企业微信
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  push-to-wecom:
    runs-on: ubuntu-latest
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      LANGUAGE: 'python'
      LIMIT: 10
    steps:
      - name: 从GitHub官方搜索获取热门项目
        run: |
          # 构造搜索语句，默认看今日star暴涨项目，替代trending
          if [ -z "$LANGUAGE" ]; then
            QUERY="stars:>1000 created:2026-11-23..* sort:stars-desc"
          else
            QUERY="stars:>1000 language:$LANGUAGE created:2026-11-23..* sort:stars-desc"
          fi

          # 调用GitHub官方api
          RAW=$(curl -s -H "Accept: application/vnd.github.v3+json" "https://api.github.com/search/repositories?q=$QUERY&per_page=$LIMIT")

          if echo "$RAW" | jq -e '.items' >/dev/null 2>&1; then
            MESSAGE=$(echo "$RAW" | jq -r '
              .items | to_entries | map(
                "### \(.key+1). [\(.value.full_name)](\(.value.html_url))\n⭐ Stars: \(.value.stargazers_count) | 📝 \(.value.description // "暂无描述")\n"
              ) | join("\n")
            ')
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n$MESSAGE"
          else
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n⚠️  获取项目数据失败\n关键词：GitHub"
          fi

          curl -s -X POST "$WECOM_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$FULL_CONTENT" '{"msgtype":"markdown","markdown":{"content":$c}}')"
