name: 每日 GitHub Trending 推送到企业微信
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  push-to-wecom:
    runs-on: ubuntu-latest
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      LANGUAGE: 'python'
      SINCE: 'daily'
      LIMIT: 15
    steps:
      - name: 抓取Trending并推送
        run: |
          # 构造稳定API地址
          if [ -z "$LANGUAGE" ]; then
            API_URL="https://ghapi.huchen.dev/repositories?since=$SINCE"
          else
            API_URL="https://ghapi.huchen.dev/repositories?language=$LANGUAGE&since=$SINCE"
          fi

          RAW=$(curl -s --connect-timeout 10 "$API_URL")

          # 判断返回是不是合法json
          if echo "$RAW" | jq -e 'type=="array"' >/dev/null; then
            MESSAGE=$(echo "$RAW" | jq -r --argjson limit "$LIMIT" '
              .[0:$limit] | to_entries | map(
                "### \(.key+1). [\(.value.name)](\(.value.url))\n⭐ Star: \(.value.stars) | 📝 \(.value.description // "暂无描述")\n"
              ) | join("\n")
            ')
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n$MESSAGE"
          else
            FULL_CONTENT="## 📰 GitHub 每日热门项目\n\n⚠️  API接口获取失败，请稍后重试"
          fi

          # 推企业微信
          curl -s -X POST "$WECOM_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"${FULL_CONTENT//\"/\\\"}\"
              }
            }"
